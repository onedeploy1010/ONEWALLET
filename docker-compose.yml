# ONE Ecosystem Docker Compose
# Production deployment configuration

version: '3.8'

services:
  # ========================================
  # ONE Engine - Backend API
  # ========================================
  one-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.engine
    container_name: one-engine
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      # Supabase
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Thirdweb
      - THIRDWEB_CLIENT_ID=${THIRDWEB_CLIENT_ID}
      - THIRDWEB_SECRET_KEY=${THIRDWEB_SECRET_KEY}
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      # Trading
      - BYBIT_API_KEY=${BYBIT_API_KEY}
      - BYBIT_API_SECRET=${BYBIT_API_SECRET}
      - BYBIT_TESTNET=${BYBIT_TESTNET:-false}
      # Onramper
      - ONRAMPER_API_KEY=${ONRAMPER_API_KEY}
      # Security
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Redis
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - one-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # ONE Dashboard - Admin Panel
  # ========================================
  one-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: one-dashboard
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Engine API
      - ONE_ENGINE_API_URL=http://one-engine:4000
      # Security
      - JWT_SECRET=${JWT_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      # Redis
      - REDIS_URL=redis://redis:6379
    depends_on:
      - one-engine
      - redis
    networks:
      - one-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # ONE Wallet Web - User Wallet Application
  # ========================================
  one-wallet-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.wallet-web
    container_name: one-wallet-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Engine API
      - NEXT_PUBLIC_ENGINE_URL=http://one-engine:4000
      - NEXT_PUBLIC_ONE_ENGINE_URL=http://one-engine:4000/api
      # Supabase
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      # Thirdweb (fetched from Engine, but can be set as fallback)
      - NEXT_PUBLIC_THIRDWEB_CLIENT_ID=${THIRDWEB_CLIENT_ID}
    depends_on:
      - one-engine
    networks:
      - one-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # Redis Cache
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: one-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - one-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Nginx Reverse Proxy (optional)
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: one-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - one-engine
      - one-dashboard
      - one-wallet-web
    networks:
      - one-network
    profiles:
      - production

networks:
  one-network:
    driver: bridge

volumes:
  redis_data:
